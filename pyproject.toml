[project]
name = "customer-api"
version = "0.1.0"
description = "FastAPI service with CRUD for customer records"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "pg8000",
    "python-dotenv",
    "pydantic[email]",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
